<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Todo List App</title>

  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h3 class="text-center mb-4">My Todo List</h3>

    <div class="input-group mb-3">
      <input
        type="text"
        id="todo-input"
        class="form-control"
        placeholder="Add a new task"
      />
      <button id="add-btn" class="btn btn-primary">Add</button>
    </div>

    <div class="text-center mb-3">
      <button class="btn btn-outline-dark filter-btn active" data-filter="all">
        All
      </button>
      <button class="btn btn-outline-dark filter-btn" data-filter="active">
        Active
      </button>
      <button class="btn btn-outline-dark filter-btn" data-filter="completed">
        Completed
      </button>
    </div>

    <ul id="todo-list" class="list-group"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
